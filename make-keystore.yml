name: Make release keystore (run once)
on: workflow_dispatch
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore nm-release.jks -storepass "$PASS" -keypass "$PASS" \
            -alias nm -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=NM Explorer"
          {
            echo "NM_STORE_PASS=$PASS"
            echo "NM_KEY_ALIAS=nm"
            echo "NM_KEY_PASS=$PASS"
            echo "NM_KEYSTORE_B64=$(base64 -w0 nm-release.jks)"
          } > secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nm-secrets
          path: secrets.txt
          retention-days: 1
