name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 1.0.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode keystore
        env:
          B64: ${{ secrets.NM_KEYSTORE_B64 }}
        run: |
          test -n "$B64" || { echo "Secret NM_KEYSTORE_B64 is missing"; exit 1; }
          echo "$B64" | base64 -d > "$RUNNER_TEMP/nm-release.jks"
          echo "NM_KEYSTORE_PATH=$RUNNER_TEMP/nm-release.jks" >> "$GITHUB_ENV"
      - name: Unpack project
        run: |
          mkdir _src && unzip -q project.zip -d _src
          echo "DIR=$(dirname "$(find _src -name settings.gradle.kts | head -1)")" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: ${{ env.DIR }}
        env:
          NM_STORE_PASS: ${{ secrets.NM_STORE_PASS }}
          NM_KEY_ALIAS: ${{ secrets.NM_KEY_ALIAS }}
          NM_KEY_PASS: ${{ secrets.NM_KEY_PASS }}
          NM_VERSION: ${{ inputs.version }}
        run: gradle assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$DIR"/app/build/outputs/apk/release/*.apk "NMExplorer-${{ inputs.version }}.apk"
          gh release create "v${{ inputs.version }}" "NMExplorer-${{ inputs.version }}.apk" \
            --title "NMExplorer ${{ inputs.version }}" \
            --notes "Release ${{ inputs.version }}"
